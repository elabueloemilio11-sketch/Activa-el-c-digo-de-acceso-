<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Estudio AudioVisual V2 · Abuelo Emilio Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/academy/assets/course.js" defer></script>
</head>
<body class="academy-body">
  <div class="academy-shell">
    <header class="academy-topbar">
      <a class="brand academy-brand" href="/academy" aria-label="Abuelo Emilio Academy">
        <span class="brand-mark">A</span><span>ABUELO EMILIO <b>ACADEMY</b></span>
      </a>
      <div class="academy-session">
        <span id="session-status" class="session-dot" aria-label="Sesión protegida"></span>
        <button id="manage-devices" class="text-button" type="button">DISPOSITIVOS</button>
        <button id="course-logout" class="text-button" type="button">SALIR</button>
      </div>
    </header>

    <section class="academy-progress-card" aria-label="Progreso del curso">
      <div>
        <span id="course-step-count">PASO 1 DE 10</span>
        <strong id="course-progress-title">Bienvenido a tu estudio</strong>
      </div>
      <div class="academy-progress-meta"><b id="course-percent">10%</b> COMPLETADO</div>
      <div class="academy-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
        <span id="course-progress-bar"></span>
      </div>
    </section>

    <div class="academy-layout">
      <aside class="academy-map" aria-label="Mapa del viaje">
        <p class="eyebrow">TU VIAJE</p>
        <ol id="course-map-list"></ol>
        <button id="open-glossary" class="academy-help-button" type="button">? DICCIONARIO SIMPLE</button>
      </aside>

      <main class="academy-stage" id="course-main" tabindex="-1">
        <article id="lesson-card" class="lesson-card" aria-live="polite">
          <div class="lesson-loading"><span></span><p>Preparando tu siguiente paso…</p></div>
        </article>
        <nav class="course-nav" aria-label="Navegación del curso">
          <button id="course-prev" class="secondary" type="button">← ANTERIOR</button>
          <button id="course-next" class="primary" type="button" disabled>SIGUIENTE →</button>
        </nav>
      </main>
    </div>
  </div>

  <dialog id="glossary-dialog" class="academy-dialog">
    <div class="dialog-head"><div><p class="eyebrow">SIN PALABRAS DIFÍCILES</p><h2 id="glossary-title">Diccionario simple</h2></div><button data-close-dialog="glossary-dialog" class="dialog-close" type="button" aria-label="Cerrar">×</button></div>
    <div id="glossary-content"></div>
  </dialog>

  <dialog id="example-dialog" class="academy-dialog">
    <div class="dialog-head"><div><p class="eyebrow">EJEMPLO REAL</p><h2 id="example-title">Así debe verse</h2></div><button data-close-dialog="example-dialog" class="dialog-close" type="button" aria-label="Cerrar">×</button></div>
    <div id="example-content"></div>
  </dialog>

  <dialog id="devices-dialog" class="academy-dialog">
    <div class="dialog-head"><div><p class="eyebrow">SEGURIDAD</p><h2>Tus dispositivos</h2></div><button data-close-dialog="devices-dialog" class="dialog-close" type="button" aria-label="Cerrar">×</button></div>
    <div id="course-device-list" class="device-list"><p class="muted">Cargando…</p></div>
  </dialog>

  <div id="course-toast" class="academy-toast" role="status" aria-live="polite" hidden></div>
  <div id="celebration" class="academy-celebration" aria-hidden="true" hidden>
    <div class="celebration-light"></div><span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span>
  </div>
</body>
</html>
