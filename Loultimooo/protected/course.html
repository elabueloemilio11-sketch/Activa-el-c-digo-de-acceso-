<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Estudio AudioVisual V2 · Abuelo Emilio Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/academy/assets/course.js" defer></script>
</head>
<body>
  <main class="course-shell">
    <header class="course-header">
      <div class="brand"><span class="brand-mark">A</span><span>ABUELO EMILIO <b>ACADEMY</b></span></div>
      <div class="header-actions">
        <button id="manage-devices" class="text-button" type="button">Dispositivos</button>
        <button id="course-logout" class="text-button" type="button">Salir</button>
      </div>
    </header>
    <div class="course-progress"><span id="course-progress-bar"></span></div>

    <section class="course-stage card">
      <div class="eyebrow">ESTUDIO AUDIOVISUAL V2</div>
      <p id="course-step-count" class="muted small">PASO 1 DE 8</p>
      <h1 id="course-title">Prepara tu estudio</h1>
      <p id="course-copy" class="course-copy">Comprueba el entorno básico antes de crear tu aplicación.</p>
      <div id="course-checklist" class="checklist"></div>
      <div class="course-nav">
        <button id="course-prev" class="secondary" type="button">ANTERIOR</button>
        <button id="course-next" class="primary" type="button">CONTINUAR</button>
      </div>
    </section>

    <dialog id="devices-dialog" class="device-dialog">
      <div class="dialog-head"><h2>Tus dispositivos</h2><button id="close-devices" class="text-button" type="button">Cerrar</button></div>
      <div id="course-device-list" class="device-list"></div>
    </dialog>
  </main>
</body>
</html>
