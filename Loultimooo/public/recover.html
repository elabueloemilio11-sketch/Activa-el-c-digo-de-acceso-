<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Recuperar acceso · Abuelo Emilio Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/recover.js" defer></script>
</head>
<body>
  <main class="auth-shell compact">
    <a class="brand" href="/access"><span class="brand-mark">A</span><span>ABUELO EMILIO <b>ACADEMY</b></span></a>
    <section class="card auth-card">
      <div class="eyebrow">RECUPERACIÓN SEGURA</div>
      <h1>Restablecer código</h1>
      <p class="muted">Al continuar, el código anterior y todos los dispositivos existentes quedarán invalidados.</p>
      <button id="confirm-recovery" class="primary" type="button">GENERAR UN CÓDIGO NUEVO</button>
      <a class="text-button link-button" href="/access">Volver al acceso</a>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
